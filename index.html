<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Runner: Energy Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050814;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #050814;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: rgba(5, 8, 20, 0.92);
            padding: 1.25rem;
            text-align: center;
        }

        .modal-card {
            max-width: 440px;
            width: 100%;
            background: rgba(12, 18, 42, 0.95);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 20px;
            padding: 1.75rem 1.5rem;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .glow-title {
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 0.4rem;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.8), 0 0 30px rgba(0, 243, 255, 0.4);
            text-transform: uppercase;
        }

        .glow-pink {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8), 0 0 30px rgba(255, 0, 127, 0.4);
            text-transform: uppercase;
        }

        .subtitle {
            color: #a5f3fc;
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
            line-height: 1.4;
        }

        .info-box {
            background: rgba(6, 12, 32, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            text-align: left;
            font-size: 0.85rem;
            color: #c7d2fe;
            line-height: 1.6;
        }

        .info-box strong {
            color: #00f3ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0.3rem;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #00f3ff, #ff00ea);
            border: none;
            border-radius: 9999px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.96);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.9);
        }

        .hud-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.25rem;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .hud-card {
            background: rgba(10, 16, 38, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 6px 14px;
            backdrop-filter: blur(4px);
        }

        .hud-label {
            font-size: 0.65rem;
            color: #67e8f9;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .hud-value {
            font-size: 1.3rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .evolution-badge {
            position: absolute;
            top: 4.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            background: rgba(255, 0, 234, 0.2);
            border: 1px solid rgba(255, 0, 234, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ff80ed;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.3);
            white-space: nowrap;
        }

        .health-bar-outer {
            width: 120px;
            height: 10px;
            background: #090d1f;
            border: 1px solid rgba(0, 243, 255, 0.5);
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 4px;
        }

        .health-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #00f3ff, #10b981);
            border-radius: 9999px;
            transition: width 0.2s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Header -->
        <div class="hud-header">
            <div class="hud-card">
                <div class="hud-label">DISTANCE</div>
                <div id="distVal" class="hud-value">0m</div>
            </div>

            <div class="hud-card" style="text-align: right;">
                <div class="hud-label">SHIELD HP</div>
                <div class="health-bar-outer">
                    <div id="shieldBar" class="health-bar-inner"></div>
                </div>
            </div>
        </div>

        <!-- Weapon Evolution Badge -->
        <div id="evolutionBadge" class="evolution-badge">
            EVO TIER 1: PLASMA BEAM
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay-screen hidden">
            <div class="modal-card">
                <h2 class="glow-pink">SHIELD CRITICAL</h2>
                <p class="subtitle">Your Mecha Mech crashed into a target barrier!</p>

                <div class="info-box" style="text-align: center;">
                    <div class="hud-label">Distance Covered</div>
                    <div id="finalDist" class="hud-value" style="font-size: 2.2rem; margin: 4px 0 8px 0;">0m</div>
                    <div class="hud-label" style="color: #ff80ed;">Highest Evo Tier: <span id="finalEvo" style="color: #fff;">1</span></div>
                </div>

                <button id="restartBtn" type="button" class="btn-action">
                    RETRY RUN
                </button>
            </div>
        </div>
    </div>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        try { this.ctx = new AudioCtx(); } catch(e) {}
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    try { this.ctx.resume(); } catch(e) {}
                }
            }

            playLaser() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.06);
                } catch(e) {}
            }

            playGatePass() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } catch(e) {}
            }

            playExplosion() {
                if (!this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.15;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, this.ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }
        }

        const audio = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const distVal = document.getElementById('distVal');
        const shieldBar = document.getElementById('shieldBar');
        const evolutionBadge = document.getElementById('evolutionBadge');
        const finalDist = document.getElementById('finalDist');
        const finalEvo = document.getElementById('finalEvo');

        let scene, camera, renderer;
        let playerMesh, floorGrid;
        let gameActive = false;
        let distance = 0;
        let evoTier = 1;
        let playerHealth = 100;
        let playerTargetX = 0;
        let playerCurrentX = 0;
        let lastShotTime = 0;

        const EVO_NAMES = [
            "EVO TIER 1: SINGLE PLASMA BEAM",
            "EVO TIER 2: DUAL ION CANNONS",
            "EVO TIER 3: TRI-SPREAD LASERS",
            "EVO TIER 4: CYBER GATLING BLASTER",
            "EVO TIER 5: QUANTUM FUSION BEAM"
        ];

        let lasers = [];
        let gatePairs = [];
        let targetWalls = [];
        let particles = [];

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050814, 0.018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 3.5, 7);
            camera.rotation.x = -0.25;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Ambient & Directional Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            // Infinite Track / Floor
            const gridGeo = new THREE.PlaneGeometry(16, 200, 16, 100);
            const gridMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.25 });
            floorGrid = new THREE.Mesh(gridGeo, gridMat);
            floorGrid.rotation.x = -Math.PI / 2;
            floorGrid.position.z = -80;
            scene.add(floorGrid);

            // Player Mecha Fighter Mesh
            const playerGroup = new THREE.Group();

            const bodyGeo = new THREE.ConeGeometry(0.6, 1.6, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.2, metalness: 0.8 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.rotation.x = Math.PI / 2;
            playerGroup.add(bodyMesh);

            const wingGeo = new THREE.BoxGeometry(2.2, 0.1, 0.6);
            const wingMat = new THREE.MeshStandardMaterial({ color: #ff00ea, roughness: 0.3 });
            const wingMesh = new THREE.Mesh(wingGeo, wingMat);
            wingMesh.position.z = 0.2;
            playerGroup.add(wingMesh);

            playerMesh = playerGroup;
            playerMesh.position.set(0, 0.8, 0);
            scene.add(playerMesh);
        }

        function createGatePair(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;

            // Left Gate (Blue)
            const gateGeo = new THREE.BoxGeometry(3.5, 3, 0.2);
            const leftMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.45 });
            const leftGate = new THREE.Mesh(gateGeo, leftMat);
            leftGate.position.x = -2.2;
            leftGate.position.y = 1.5;
            group.add(leftGate);

            // Right Gate (Orange/Pink)
            const rightMat = new THREE.MeshBasicMaterial({ color: 0xff00ea, transparent: true, opacity: 0.45 });
            const rightGate = new THREE.Mesh(gateGeo, rightMat);
            rightGate.position.x = 2.2;
            rightGate.position.y = 1.5;
            group.add(rightGate);

            group.userData = { passed: false, leftVal: 1, rightVal: 1 };
            scene.add(group);
            gatePairs.push(group);
        }

        function createTargetWall(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;

            const wallGeo = new THREE.BoxGeometry(3.2, 2.5, 0.5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.4 });

            const wallMesh = new THREE.Mesh(wallGeo, wallMat);
            wallMesh.position.y = 1.25;

            // Random side
            const isLeft = Math.random() > 0.5;
            wallMesh.position.x = isLeft ? -2.2 : 2.2;

            const hp = Math.floor(Math.random() * 15) + 10 + Math.floor(distance * 0.1);
            group.userData = { hp: hp, maxHp: hp, mesh: wallMesh, x: wallMesh.position.x };

            group.add(wallMesh);
            scene.add(group);
            targetWalls.push(group);
        }

        function fireLasers() {
            if (!gameActive) return;
            const now = Date.now();
            const cooldown = evoTier >= 4 ? 100 : 160;
            if (now - lastShotTime < cooldown) return;
            lastShotTime = now;

            audio.playLaser();

            const laserGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 6);
            const laserMat = new THREE.MeshBasicMaterial({ color: evoTier >= 3 ? 0xff00ea : 0x00f3ff });

            function spawnBeam(xOffset, vx = 0) {
                const laser = new THREE.Mesh(laserGeo, laserMat);
                laser.rotation.x = Math.PI / 2;
                laser.position.set(playerMesh.position.x + xOffset, playerMesh.position.y, playerMesh.position.z - 0.8);
                laser.userData = { vx: vx, vy: 0, vz: -1.8 };
                scene.add(laser);
                lasers.push(laser);
            }

            if (evoTier === 1) {
                spawnBeam(0);
            } else if (evoTier === 2) {
                spawnBeam(-0.4);
                spawnBeam(0.4);
            } else if (evoTier === 3) {
                spawnBeam(-0.5, -0.08);
                spawnBeam(0);
                spawnBeam(0.5, 0.08);
            } else if (evoTier >= 4) {
                spawnBeam(-0.6, -0.12);
                spawnBeam(-0.2);
                spawnBeam(0.2);
                spawnBeam(0.6, 0.12);
            }
        }

        function createExplosion(pos, colorHex = 0x00f3ff) {
            for (let i = 0; i < 10; i++) {
                const pGeo = new THREE.SphereGeometry(0.1, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    vz: (Math.random() - 0.5) * 0.4,
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function updatePlayerX(clientX) {
            const normX = (clientX / window.innerWidth) * 2 - 1;
            playerTargetX = normX * 3.8;
        }

        window.addEventListener('pointermove', e => {
            if (gameActive) updatePlayerX(e.clientX);
        });

        window.addEventListener('touchmove', e => {
            if (gameActive && e.touches.length > 0) updatePlayerX(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') playerTargetX = Math.max(-3.8, playerTargetX - 0.8);
            if (e.key === 'ArrowRight' || e.key === 'd') playerTargetX = Math.min(3.8, playerTargetX + 0.8);
        });

        function launchGame() {
            audio.init();
            gameActive = true;
            distance = 0;
            evoTier = 1;
            playerHealth = 100;
            playerTargetX = 0;
            playerCurrentX = 0;

            evolutionBadge.innerText = EVO_NAMES[0];
            shieldBar.style.width = '100%';

            // Clear old objects
            gatePairs.forEach(g => scene.remove(g));
            targetWalls.forEach(w => scene.remove(w));
            lasers.forEach(l => scene.remove(l));
            particles.forEach(p => scene.remove(p));

            gatePairs = [];
            targetWalls = [];
            lasers = [];
            particles = [];

            // Spawn initial obstacles
            for (let i = 1; i <= 5; i++) {
                createGatePair(-i * 35);
                createTargetWall(-i * 35 - 18);
            }

            if (startScreen) {
                startScreen.classList.add('hidden');
                startScreen.style.display = 'none';
            }
            if (gameOverScreen) {
                gameOverScreen.classList.add('hidden');
                gameOverScreen.style.display = 'none';
            }
        }

        function triggerGameOver() {
            gameActive = false;
            audio.playExplosion();
            finalDist.innerText = `${Math.floor(distance)}m`;
            finalEvo.innerText = evoTier;

            gameOverScreen.classList.remove('hidden');
            gameOverScreen.style.display = 'flex';
        }

        function bindStart(elem) {
            if (!elem) return;
            const handler = function(e) {
                if (e && e.stopPropagation) e.stopPropagation();
                launchGame();
            };
            elem.addEventListener('click', handler);
            elem.addEventListener('touchend', handler);
            elem.addEventListener('pointerup', handler);
        }

        bindStart(startBtn);
        bindStart(restartBtn);

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                distance += 0.35;
                distVal.innerText = `${Math.floor(distance)}m`;

                // Smooth mecha movement
                playerCurrentX += (playerTargetX - playerCurrentX) * 0.15;
                playerMesh.position.x = playerCurrentX;
                playerMesh.rotation.z = -(playerTargetX - playerCurrentX) * 0.25;

                // Animate track grid texture
                floorGrid.position.z += 0.6;
                if (floorGrid.position.z > -40) floorGrid.position.z = -80;

                fireLasers();

                // Update Lasers
                for (let i = lasers.length - 1; i >= 0; i--) {
                    const l = lasers[i];
                    l.position.x += l.userData.vx;
                    l.position.z += l.userData.vz;

                    if (l.position.z < -120) {
                        scene.remove(l);
                        lasers.splice(i, 1);
                    }
                }

                // Update Gates
                for (let i = gatePairs.length - 1; i >= 0; i--) {
                    const g = gatePairs[i];
                    g.position.z += 0.6;

                    // Pass gate logic
                    if (!g.userData.passed && g.position.z > -1) {
                        g.userData.passed = true;
                        audio.playGatePass();
                        if (evoTier < 5) {
                            evoTier++;
                            evolutionBadge.innerText = EVO_NAMES[evoTier - 1];
                            createExplosion(playerMesh.position, 0x00f3ff);
                        }
                    }

                    if (g.position.z > 10) {
                        scene.remove(g);
                        gatePairs.splice(i, 1);
                        createGatePair(-160);
                    }
                }

                // Update Target Walls & Collision
                for (let i = targetWalls.length - 1; i >= 0; i--) {
                    const w = targetWalls[i];
                    w.position.z += 0.6;

                    // Laser hits wall
                    for (let j = lasers.length - 1; j >= 0; j--) {
                        const l = lasers[j];
                        if (Math.abs(l.position.z - w.position.z) < 1.0 && Math.abs(l.position.x - w.userData.x) < 1.8) {
                            w.userData.hp--;
                            createExplosion(l.position, 0xff00ea);
                            scene.remove(l);
                            lasers.splice(j, 1);

                            if (w.userData.hp <= 0) {
                                audio.playExplosion();
                                createExplosion(w.position, 0xa855f7);
                                scene.remove(w);
                                targetWalls.splice(i, 1);
                                createTargetWall(-170);
                                break;
                            }
                        }
                    }

                    // Player collides with wall
                    if (w && Math.abs(w.position.z - playerMesh.position.z) < 0.8 && Math.abs(w.userData.x - playerMesh.position.x) < 1.5) {
                        playerHealth -= 35;
                        shieldBar.style.width = `${Math.max(0, playerHealth)}%`;
                        createExplosion(playerMesh.position, 0xff0055);
                        scene.remove(w);
                        targetWalls.splice(i, 1);

                        if (playerHealth <= 0) {
                            triggerGameOver();
                        }
                    } else if (w && w.position.z > 10) {
                        scene.remove(w);
                        targetWalls.splice(i, 1);
                        createTargetWall(-170);
                    }
                }

                // Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.life -= 0.04;

                    if (p.userData.life <= 0) {
                        scene.remove(p);
                        particles.splice(i, 1);
                    }
                }
            } else {
                // Ambient idle background spin
                if (floorGrid) floorGrid.position.z += 0.15;
                if (floorGrid && floorGrid.position.z > -40) floorGrid.position.z = -80;
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize 3D scene & start game immediately on load
        window.onload = () => {
            init3D();
            launchGame();
            animate();
        };

        // Initialize Web Audio on first user interaction anywhere
        const enableAudio = () => {
            audio.init();
            window.removeEventListener('pointerdown', enableAudio);
            window.removeEventListener('touchstart', enableAudio);
        };
        window.addEventListener('pointerdown', enableAudio);
        window.addEventListener('touchstart', enableAudio);
    </script>
</body>
</html>
